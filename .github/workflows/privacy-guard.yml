# Scans the checked-out tree (HEAD, or the pull request merge result).
# It does not walk older git history.
#
# gitleaks-action requires GITLEAKS_LICENSE for organization accounts and
# would need a stored secret. This workflow uses the MIT-licensed gitleaks
# binary instead, so it stays free and secret-free.
name: privacy-guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan HEAD
        run: |
          set -euo pipefail
          gitleaks detect --no-git --source . \
            --config .gitleaks.toml \
            --redact --no-banner --exit-code 1
